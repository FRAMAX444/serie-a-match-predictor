name: Apply uploaded ZIP replacement

on:
  push:
    branches:
      - chatgpt-exact-replace-20260828
    paths:
      - 'tmp_exact_upload/READY'

permissions:
  contents: write

jobs:
  replace-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild payload and replace main
        shell: bash
        run: |
          set -euo pipefail
          cat tmp_exact_upload/part_*.txt | base64 -d > /tmp/final-rsync-payload.tar.xz
          echo "dcc97761dc39a1a8ef96b096abdff047aafac3cf0fb0747f5ab4862ad6ee5f9a  /tmp/final-rsync-payload.tar.xz" | sha256sum -c -

          rm -rf /tmp/payload && mkdir -p /tmp/payload
          tar -xJf /tmp/final-rsync-payload.tar.xz -C /tmp/payload

          sudo apt-get update -qq
          sudo apt-get install -y -qq rdiff

          git fetch origin main
          git checkout -B chatgpt-final-replacement origin/main

          xz -dc /tmp/payload/__chatgpt_transfer__/matches.rsd.xz > /tmp/matches.rsd
          rdiff patch data/matches.json /tmp/matches.rsd /tmp/matches.new.json
          test "$(git hash-object /tmp/matches.new.json)" = "e4f6433b885a166b7866b281bed3c3aa1902602f"

          rm -rf /tmp/payload/__chatgpt_transfer__
          cp -a /tmp/payload/. .
          mv /tmp/matches.new.json data/matches.json
          rm -f outcome-display.js tests/outcome-display.test.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace repository with uploaded ZIP contents"
          git push origin HEAD:main
