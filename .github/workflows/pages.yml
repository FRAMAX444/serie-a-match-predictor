name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # update-data.yml committa data/matches.json quattro volte al giorno con il GITHUB_TOKEN,
  # e un push del bot non fa scattare `push:`. Senza questo trigger il dataset che il sito
  # serve non passa mai dalla validazione qui sotto: e' esattamente cio' che e' successo fra
  # il 29-08 e il 10-09-2026, quando 92014d6 ha rimosso il trigger e i controlli su
  # target_season e sul minimo di gare. 18b440e ha ripristinato update-data.yml, non questo.
  workflow_run:
    workflows: ["Update European competition data"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Il deploy pubblica il dataset che sta nel repository, quello che update-data.yml
      # costruisce (update_top5_data.py), arricchisce (enrich_competitions_players.py), valida e
      # committa quattro volte al giorno — cioe' la stessa sequenza che si lancia in locale.
      #
      # PRIMA questo job ricostruiva data/matches.json da solo, con `--skip-understat` e senza
      # l'arricchimento: il sito pubblicato serviva quindi un dataset diverso da quello validato,
      # senza xG reali e senza player_context. Non e' una scelta di leggerezza, e' il difetto 18
      # di MISTAKES.md. I controlli qui sotto sono la rete che impedisce di ricaderci.
      - name: Validate application and production payload
        run: |
          python -m py_compile scripts/update_europe_data.py scripts/update_uefa_data.py scripts/update_top5_data.py scripts/understat_team_api.py scripts/enrich_competitions_players.py
          npm test
          npm run check
          python - <<'PY'
          import gzip
          import json
          import re
          from pathlib import Path

          path = Path("data/matches.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          expected = {"ucl", "uel", "uecl", "eng.1", "esp.1", "ita.1", "ger.1", "fra.1"}
          available = {
              str(item.get("id"))
              for item in payload.get("competitions", [])
              if isinstance(item, dict) and item.get("fixtures")
          }
          missing = sorted(expected - available)
          if missing:
              raise SystemExit(f"Competizioni mancanti nel deploy: {', '.join(missing)}")
          target = str(payload.get("target_season") or "")
          if not re.fullmatch(r"\d{4}", target):
              raise SystemExit(f"Stagione target non valida: {target!r}")
          matches = payload.get("matches")
          if not isinstance(matches, list) or len(matches) < 400:
              raise SystemExit("Storico del dataset insufficiente")
          # La versione la scrive chi COSTRUISCE il dataset. Che l'arricchimento sia stato
          # eseguito lo dice player_context qui sotto, non questa stringa.
          if payload.get("model_inputs_version") != "4.1-top5-uefa-core":
              raise SystemExit(
                  "Versione dataset di produzione non valida: "
                  f"{payload.get('model_inputs_version')!r}. Attesa quella scritta da "
                  "update_top5_data.py."
              )
          coverage = payload.get("coverage") or {}
          # I due campi che il vecchio deploy azzerava in silenzio. Entrambi producono numeri
          # plausibili quando mancano — il modello ripiega sul proxy dei tiri e i mercati sui
          # giocatori spariscono dall'interfaccia — quindi vanno verificati, non guardati.
          if not payload.get("player_context"):
              raise SystemExit(
                  "player_context assente: il sito perderebbe mercati sui giocatori e "
                  "formazioni probabili senza alcun errore visibile."
              )
          if not coverage.get("xg_actual_matches"):
              raise SystemExit(
                  "Nessuna gara con xG reale nel dataset: xgValue() ripiegherebbe sul proxy "
                  "dei tiri per ogni partita, cioe' su un modello diverso da quello misurato."
              )
          # Pages serve questo file con `content-encoding: gzip`, quindi il peso che l'utente
          # paga e' quello compresso: 1.18 MiB il 10-09-2026, contro 12.06 MiB su disco. Il
          # limite grezzo misurava il numero sbagliato e bocciava il caso BUONO: le 18 colonne
          # di quote di chiusura di Football-Data pesano 2.2 MiB su disco e quasi nulla una
          # volta compresse, quindi il dataset completo sforava mentre quello degradato, senza
          # quote e piu' leggero, passava.
          size = path.stat().st_size
          transferred = len(gzip.compress(path.read_bytes(), 6))
          limit = 3 * 1024 * 1024
          print(
              f"Payload produzione: {size / 1024:.1f} KiB su disco, "
              f"{transferred / 1024:.1f} KiB trasferiti; stagione: {target}; "
              f"competizioni: {len(available)}; training: {len(matches)}; "
              f"xG reali: {coverage.get('xg_actual_matches')}/{coverage.get('training_matches')}; "
              f"squadre con rosa: {coverage.get('player_context_teams')}"
          )
          if transferred > limit:
              raise SystemExit(
                  f"Payload troppo pesante: {transferred} byte compressi, limite {limit}"
              )
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
