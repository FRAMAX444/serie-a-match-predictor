name: Update European competition data

on:
  schedule:
    - cron: "23 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      target_season:
        description: "Override stagione (es. 2728). Vuoto = calcolata automaticamente dalla data odierna."
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "scripts/update_*.py"
      - "scripts/enrich_competitions_players.py"
      - "requirements.txt"
      - ".github/workflows/update-data.yml"

env:
  TARGET_SEASON: ${{ inputs.target_season || '' }}

permissions:
  contents: write

concurrency:
  group: european-competition-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Preserve previous player context
        run: cp data/matches.json "$RUNNER_TEMP/matches.previous.json"
      - name: Build Big Five and UEFA dataset
        shell: bash
        run: |
          for attempt in 1 2; do
            if python scripts/update_top5_data.py --target-season "$TARGET_SEASON" --history-seasons 4; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "Dataset build failed after retry" >&2
              exit 1
            fi
            echo "Dataset build failed; retrying once after a transient-source error" >&2
            sleep 15
          done
      - name: Enrich team and player context
        run: >-
          python scripts/enrich_competitions_players.py
          --target-season "$TARGET_SEASON"
          --previous-data "$RUNNER_TEMP/matches.previous.json"
      - name: Validate generated dataset
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("data/matches.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          expected = {"ucl", "uel", "uecl", "eng.1", "esp.1", "ita.1", "ger.1", "fra.1"}
          competitions = {
              str(item.get("id")): item
              for item in payload.get("competitions", [])
              if isinstance(item, dict) and item.get("id")
          }
          missing = sorted(expected - set(competitions))
          if missing:
              raise SystemExit(f"Competizioni mancanti: {', '.join(missing)}")
          target = str(payload.get("target_season") or "")
          if not re.fullmatch(r"\d{4}", target):
              raise SystemExit(f"Stagione target non valida: {target!r}")
          matches = payload.get("matches")
          if not isinstance(matches, list) or len(matches) < 400:
              raise SystemExit(f"Storico insufficiente: {len(matches) if isinstance(matches, list) else 0} partite")
          fixture_count = sum(
              len(item.get("fixtures", []))
              for item in competitions.values()
              if isinstance(item.get("fixtures"), list)
          )
          if fixture_count <= 0:
              raise SystemExit("Nessuna fixture disponibile nel dataset generato")
          if path.stat().st_size > 12 * 1024 * 1024:
              raise SystemExit("Dataset oltre il limite di sicurezza di 12 MiB")
          print(f"Dataset valido: stagione {target}, {len(matches)} gare training, {fixture_count} fixture")
          PY
      - name: Validate code and model
        run: |
          python -m py_compile scripts/update_europe_data.py scripts/update_uefa_data.py scripts/update_top5_data.py scripts/understat_team_api.py scripts/enrich_competitions_players.py
          npm run test:py
          npm test
          npm run check
      - name: Commit changed dataset
        shell: bash
        run: |
          if git diff --quiet -- data/matches.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/matches.json
          git commit -m "Update European predictor data"
          if git push origin HEAD:main; then
            exit 0
          fi
          echo "main changed while the dataset was being built; rebasing and retrying push" >&2
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
