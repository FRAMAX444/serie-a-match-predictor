name: Update European competition data

on:
  schedule:
    - cron: "23 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      target_season:
        description: "Override stagione (es. 2728). Vuoto = calcolata automaticamente dalla data odierna."
        required: false
        default: ""

env:
  # Vuoto di default: scripts/update_europe_data.py::resolve_target_season() la calcola
  # da date.today() (likely_start_year). PRIMA era hardcoded a "2627": andava bene finché
  # non arrivava la stagione successiva, poi qualcuno doveva ricordarsi di aggiornarlo a mano
  # nel file YAML — altrimenti il dataset avrebbe continuato silenziosamente a scaricare la
  # stagione sbagliata. Per un override puntuale, lancia il workflow manualmente e valorizza
  # l'input "target_season".
  TARGET_SEASON: ${{ github.event.inputs.target_season || '' }}

permissions:
  contents: write

concurrency:
  group: european-competition-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Build Big Five and UEFA dataset
        run: python scripts/update_top5_data.py --target-season "$TARGET_SEASON" --history-seasons 4
      - name: Enrich team context (lineup, availability, promozioni)
        run: python scripts/enrich_competitions_players.py --target-season "$TARGET_SEASON"
      - name: Validate generated inputs and model
        run: |
          python -m py_compile scripts/update_europe_data.py scripts/update_uefa_data.py scripts/update_top5_data.py scripts/serie_a_sdp.py scripts/understat_team_api.py scripts/enrich_competitions_players.py
          python -m unittest discover -s tests -p "test_*.py" -v
          npm test
          npm run check
      - name: Commit changed dataset
        run: |
          if git diff --quiet -- data/matches.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          git commit -m "Update European predictor data"
          git push
